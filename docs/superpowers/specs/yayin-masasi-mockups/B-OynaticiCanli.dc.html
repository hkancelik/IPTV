<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Yayın Masası, oynatıcı, canlı yayın</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C5CDD1;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; box-sizing: border-box; overflow: hidden; background: #000000; color: #E9EDEF; font-family: 'Archivo', sans-serif">

<svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%">
<rect width="1280" height="720" fill="#2E7A45"></rect>
<rect x="160" width="160" height="720" fill="#35874D"></rect>
<rect x="480" width="160" height="720" fill="#35874D"></rect>
<rect x="800" width="160" height="720" fill="#35874D"></rect>
<rect x="1120" width="160" height="720" fill="#35874D"></rect>
<path d="M640 0V720" stroke="#E6F2E8" stroke-width="6"></path>
<circle cx="640" cy="360" r="130" fill="none" stroke="#E6F2E8" stroke-width="6"></circle>
<circle cx="640" cy="360" r="9" fill="#E6F2E8"></circle>
<rect x="-6" y="170" width="190" height="380" fill="none" stroke="#E6F2E8" stroke-width="6"></rect>
<rect x="1096" y="170" width="190" height="380" fill="none" stroke="#E6F2E8" stroke-width="6"></rect>
</svg>

<div style="position: absolute; left: 28px; right: 28px; top: 20px; display: flex; align-items: center; gap: 8px">
<a href="B-Canli.dc.html" aria-label="Geri" style="width: 44px; height: 44px; border-radius: 4px; border: 1px solid #30373B; background: rgba(5,6,6,0.9); color: #E9EDEF; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
</a>
<span style="margin-left: auto; height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 4px; background: rgba(5,6,6,0.9); font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 20px; color: #FFB020">21:47:05</span>
</div>

<div style="position: absolute; left: 28px; right: 28px; bottom: 24px; box-sizing: border-box; padding: 18px 18px 16px; border-radius: 4px; background: rgba(5,6,6,0.92); display: flex; flex-direction: column; gap: 16px">

<div style="display: grid; grid-template-columns: auto minmax(0, 1fr) 300px; align-items: center; gap: 22px">
<div style="display: flex; align-items: center; gap: 16px">
<span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 52px; line-height: 1; color: #FFB020">012</span>
<div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start">
<span style="font-weight: 800; font-stretch: 125%; font-size: 26px; line-height: 1">TRT Spor</span>
<span style="padding: 2px 8px; border-radius: 2px; background: #FF3B30; color: #140504; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px">CANLI</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 9px; padding-left: 22px; border-left: 1px solid #30373B">
<div style="display: flex; align-items: baseline; gap: 14px">
<span style="font-weight: 700; font-size: 20px">Stadyum</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 15px; color: #C5CDD1">21:00 – 22:30</span>
</div>
<div style="height: 4px; background: #2A3034"><div style="width: 52%; height: 100%; background: #FFB020"></div></div>
<div style="display: flex; align-items: baseline; gap: 10px; font-size: 15px">
<span style="font-weight: 600; font-stretch: 88%; color: #8B969C">Sırada</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-weight: 500; color: #C5CDD1">22:30</span>
<span style="font-weight: 600">Spor Haberleri</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 3px; background: #181B1D">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B969C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg>
<span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px; color: #FFB020">011</span>
<span style="font-weight: 600; font-size: 14px">TRT 1</span>
<span style="margin-left: auto; font-size: 13px; font-stretch: 88%; color: #8B969C">Akşam dizisi</span>
</div>
<div style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 3px; background: #181B1D">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B969C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
<span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px; color: #FFB020">013</span>
<span style="font-weight: 600; font-size: 14px">NTV</span>
<span style="margin-left: auto; font-size: 13px; font-stretch: 88%; color: #8B969C">Gece Bülteni</span>
</div>
</div>
</div>

<div style="display: flex; align-items: center; gap: 8px">
<button aria-label="Önceki kanal" style="width: 48px; height: 44px; border-radius: 4px; border: 1px solid #30373B; background: #1B1F21; color: #E9EDEF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg>
</button>
<button aria-label="Duraklat" style="width: 72px; height: 44px; box-sizing: border-box; border-radius: 4px; border: 3px solid #FFB020; background: #2A2414; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="4" width="5" height="16"></rect><rect x="14" y="4" width="5" height="16"></rect></svg>
</button>
<button aria-label="Sonraki kanal" style="width: 48px; height: 44px; border-radius: 4px; border: 1px solid #30373B; background: #1B1F21; color: #E9EDEF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
</button>

<div role="slider" aria-label="Ses düzeyi" aria-valuemin="0" aria-valuemax="10" aria-valuenow="7" tabindex="0" style="display: flex; align-items: center; gap: 10px; height: 44px; margin-left: 16px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C5CDD1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg>
<span style="display: flex; gap: 3px">
<sc-for list="{{meter}}" as="m" hint-placeholder-count="10">
<span style="width: 7px; height: 20px; background: {{m.color}}"></span>
</sc-for>
</span>
</div>

<span style="margin-left: 16px; font-size: 14px; font-stretch: 88%; color: #8B969C">Kumandada yukarı ve aşağı tuşları kanal değiştirir.</span>

<button style="display: flex; align-items: center; gap: 8px; height: 44px; margin-left: auto; padding: 0 14px; border-radius: 4px; border: 1px solid #30373B; background: #1B1F21; color: #E9EDEF; font: 600 15px 'Archivo', sans-serif; cursor: pointer">
<span style="font-stretch: 88%; color: #8B969C">Ses</span>
Türkçe
</button>
<button style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 4px; border: 1px solid #30373B; background: #1B1F21; color: #E9EDEF; font: 600 15px 'Archivo', sans-serif; cursor: pointer">
<span style="font-stretch: 88%; color: #8B969C">Altyazı</span>
Kapalı
</button>
<button aria-label="Tam ekran" style="width: 48px; height: 44px; border-radius: 4px; border: 1px solid #30373B; background: #1B1F21; color: #E9EDEF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5M21 8V3h-5M3 16v5h5M16 21h5v-5"></path></svg>
</button>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
renderVals() {
const meter = [];
for (let i = 0; i < 10; i++) meter.push({ color: i < 7 ? '#E9EDEF' : '#30373B' });
return { meter };
}
}
</script>
</body>
</html>
