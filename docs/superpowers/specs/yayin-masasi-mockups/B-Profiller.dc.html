<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Yayın Masası, profil seçimi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C5CDD1;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; box-sizing: border-box; overflow: hidden; background-color: #0E1011; background-image: linear-gradient(rgba(255,255,255,0.028) 1px, rgba(255,255,255,0) 1px), linear-gradient(90deg, rgba(255,255,255,0.028) 1px, rgba(255,255,255,0) 1px); background-size: 40px 40px; color: #E9EDEF; font-family: 'Archivo', sans-serif">

<header style="position: absolute; left: 28px; right: 28px; top: 16px; height: 44px; display: flex; align-items: center; gap: 8px">
<span role="img" aria-label="IPTV" style="display: flex; height: 30px">
<span style="width: 7px; background: #C8C8C8"></span><span style="width: 7px; background: #C8C800"></span><span style="width: 7px; background: #00C8C8"></span><span style="width: 7px; background: #00C800"></span><span style="width: 7px; background: #C800C8"></span><span style="width: 7px; background: #D01818"></span><span style="width: 7px; background: #1818D0"></span>
</span>
<span style="margin: 0 18px 0 8px; font-weight: 800; font-stretch: 125%; font-size: 20px; letter-spacing: 0.02em">IPTV</span>
<span style="margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 22px; color: #FFB020">21:47:05</span>
</header>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 72px; height: 1px; background: #2A3034"></div>

<main style="position: absolute; left: 136px; right: 136px; top: 172px; display: flex; flex-direction: column; gap: 28px">
<h1 style="margin: 0; font-weight: 800; font-stretch: 125%; font-size: 36px; line-height: 1.1">Kullanıcı seç</h1>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{profiles}}" as="p" hint-placeholder-count="3">
<a href="Main.dc.html" style="display: flex; flex-direction: column; color: #E9EDEF">
<div style="height: 135px; border-radius: 4px 4px 0 0; background: #181B1D; box-shadow: {{p.ring}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-stretch: 125%; font-size: 64px">{{p.initial}}</div>
<div style="display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 12px; background: {{p.umd}}">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<span style="font-weight: 600; font-size: 16px">{{p.name}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 12px; color: #8B969C; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.host}}</span>
</span>
<sc-if value="{{p.last}}" hint-placeholder-val="{{ false }}">
<span style="padding: 2px 7px; border: 1px solid #5B666C; border-radius: 2px; font-weight: 600; font-stretch: 88%; font-size: 12px; color: #C5CDD1">Son kullanılan</span>
</sc-if>
</div>
</a>
</sc-for>
<button style="display: flex; flex-direction: column; padding: 0; border: 0; background: transparent; color: #E9EDEF; font-family: 'Archivo', sans-serif; text-align: left; cursor: pointer">
<span style="box-sizing: border-box; width: 100%; height: 135px; border-radius: 4px 4px 0 0; border: 1px dashed #3A4247; display: flex; align-items: center; justify-content: center; color: #8B969C">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</span>
<span style="box-sizing: border-box; width: 100%; display: flex; flex-direction: column; justify-content: center; gap: 1px; height: 54px; padding: 0 12px; background: #050606">
<span style="font-weight: 600; font-size: 16px">Kullanıcı ekle</span>
<span style="font-size: 12px; font-stretch: 88%; color: #8B969C">Telefondan QR ile ya da elle</span>
</span>
</button>
</div>
<div style="display: flex; align-items: center; gap: 16px">
<button style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px 0 12px; border-radius: 4px; border: 1px solid #30373B; background: #1B1F21; color: #E9EDEF; font: 600 15px 'Archivo', sans-serif; font-stretch: 88%; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
Kullanıcıları düzenle
</button>
<span style="font-size: 14px; color: #8B969C">Açılışta son kullanılan hesapla otomatik giriş yapılır.</span>
</div>
</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
renderVals() {
const profile = (name, host, o) => {
const opts = o || {};
return {
name, host,
initial: name.charAt(0),
last: !!opts.last,
ring: opts.focused ? 'inset 0 0 0 4px #FFB020' : 'none',
umd: opts.focused ? '#2A2414' : '#050606'
};
};
return {
profiles: [
profile('Hakan', '[SUNUCU ADRESİ]', { last: true, focused: true }),
profile('Salon', '[SUNUCU ADRESİ]'),
profile('Misafir', '[SUNUCU ADRESİ]')
]
};
}
}
</script>
</body>
</html>
