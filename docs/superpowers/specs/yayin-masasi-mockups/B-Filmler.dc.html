<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Yayın Masası, filmler</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C5CDD1;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; box-sizing: border-box; overflow: hidden; background-color: #0E1011; background-image: linear-gradient(rgba(255,255,255,0.028) 1px, rgba(255,255,255,0) 1px), linear-gradient(90deg, rgba(255,255,255,0.028) 1px, rgba(255,255,255,0) 1px); background-size: 40px 40px; color: #E9EDEF; font-family: 'Archivo', sans-serif">

<header style="position: absolute; left: 28px; right: 28px; top: 16px; height: 44px; display: flex; align-items: center; gap: 8px">
<span role="img" aria-label="IPTV" style="display: flex; height: 30px">
<span style="width: 7px; background: #C8C8C8"></span><span style="width: 7px; background: #C8C800"></span><span style="width: 7px; background: #00C8C8"></span><span style="width: 7px; background: #00C800"></span><span style="width: 7px; background: #C800C8"></span><span style="width: 7px; background: #D01818"></span><span style="width: 7px; background: #1818D0"></span>
</span>
<span style="margin: 0 18px 0 8px; font-weight: 800; font-stretch: 125%; font-size: 20px; letter-spacing: 0.02em">IPTV</span>
<nav aria-label="Ana menü" style="display: flex; gap: 6px">
<a href="Main.dc.html" style="display: flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 4px; border: 1px solid #30373B; background: #1B1F21; font-weight: 600; font-size: 15px; font-stretch: 88%">Ana sayfa</a>
<a href="B-Canli.dc.html" style="display: flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 4px; border: 1px solid #30373B; background: #1B1F21; font-weight: 600; font-size: 15px; font-stretch: 88%">Canlı TV</a>
<a href="B-Filmler.dc.html" aria-current="page" style="display: flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 4px; border: 1px solid #FF3B30; background: #FF3B30; color: #140504; font-weight: 700; font-size: 15px; font-stretch: 88%">Filmler</a>
<a href="B-Detay.dc.html" style="display: flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 4px; border: 1px solid #30373B; background: #1B1F21; font-weight: 600; font-size: 15px; font-stretch: 88%">Diziler</a>
<a href="Main.dc.html" style="display: flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 4px; border: 1px solid #30373B; background: #1B1F21; font-weight: 600; font-size: 15px; font-stretch: 88%">Favoriler</a>
<a href="B-Ayarlar.dc.html" style="display: flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 4px; border: 1px solid #30373B; background: #1B1F21; font-weight: 600; font-size: 15px; font-stretch: 88%">Ayarlar</a>
</nav>
<span style="margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 22px; color: #FFB020">21:47:05</span>
</header>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 72px; height: 1px; background: #2A3034"></div>

<aside aria-label="Kategoriler" style="position: absolute; left: 28px; top: 88px; width: 196px; display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="10">
<button style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 4px; border: 1px solid {{g.border}}; background: {{g.bg}}; color: {{g.fg}}; font: {{g.weight}} 15px 'Archivo', sans-serif; text-align: left; cursor: pointer">
<span style="width: 8px; height: 8px; flex: none; border-radius: 50%; background: {{g.led}}"></span>
<span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.name}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 13px; color: #8B969C">{{g.count}}</span>
</button>
</sc-for>
<button style="display: flex; align-items: center; gap: 10px; height: 44px; margin-top: 8px; padding: 0 12px; border-radius: 4px; border: 1px dashed #3A4247; background: transparent; color: #8B969C; font: 600 14px 'Archivo', sans-serif; font-stretch: 88%; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"></path></svg>
Kategorileri düzenle
</button>
</aside>

<main style="position: absolute; left: 244px; top: 88px; width: 1008px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 8px; height: 44px">
<label style="flex: 1; display: flex; align-items: center; gap: 10px; height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 4px; border: 1px solid #30373B; background: #050606; color: #8B969C">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
<input type="text" placeholder="Film ara" aria-label="Film ara" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #E9EDEF; font: 500 16px 'Archivo', sans-serif">
</label>
<button style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 4px; border: 1px solid #30373B; background: #1B1F21; color: #E9EDEF; font: 600 15px 'Archivo', sans-serif; cursor: pointer">
<span style="font-stretch: 88%; color: #8B969C">Sıralama</span>
Yeni eklenen
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B969C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
</button>
<span style="margin-left: 8px; font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 14px; color: #8B969C">18.420 film</span>
</div>

<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{films}}" as="f" hint-placeholder-count="14">
<a href="B-Detay.dc.html" style="display: flex; flex-direction: column; color: #E9EDEF">
<div style="position: relative; height: 190px; border-radius: 4px 4px 0 0; background: {{f.art}}; box-shadow: {{f.ring}}">
<sc-if value="{{f.fav}}" hint-placeholder-val="{{ false }}">
<span role="img" aria-label="Favorilerde" style="position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 2px; background: #050606; display: flex; align-items: center; justify-content: center">
<svg width="14" height="14" viewBox="0 0 24 24" fill="#E9EDEF" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"></path></svg>
</span>
</sc-if>
</div>
<div style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; background: {{f.umd}}">
<span style="flex: 1; min-width: 0; font-weight: 600; font-stretch: 88%; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.title}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 12px; color: #FFB020">{{f.year}}</span>
</div>
</a>
</sc-for>
</div>
</main>

<section aria-label="Seçili film" style="position: absolute; left: 244px; top: 620px; width: 1008px; height: 76px; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 0 18px; background: #050606; border-radius: 4px">
<span style="font-weight: 800; font-stretch: 125%; font-size: 24px">Kış Uykusu</span>
<span style="padding: 2px 8px; border: 1px solid #5B666C; border-radius: 2px; font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 13px; color: #C5CDD1">2014</span>
<span style="padding: 2px 8px; border: 1px solid #5B666C; border-radius: 2px; font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 13px; color: #C5CDD1">TR</span>
<span style="font-size: 15px; color: #8B969C">Yerli Filmler</span>
<span style="margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: #C5CDD1">
<svg width="16" height="16" viewBox="0 0 24 24" fill="#E9EDEF" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"></path></svg>
Favorilerde
</span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: #C5CDD1">
<span style="padding: 1px 7px; border: 1px solid #5B666C; border-radius: 3px; font-family: 'IBM Plex Mono', monospace; font-size: 12px">OK</span>
Ayrıntılar
</span>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
renderVals() {
const group = (name, count, selected) => ({
name, count,
bg: selected ? '#262C30' : 'transparent',
border: selected ? '#3A4247' : 'transparent',
fg: selected ? '#FFFFFF' : '#C5CDD1',
weight: selected ? 700 : 500,
led: selected ? '#FF3B30' : '#30373B'
});
const film = (title, year, a, b, o) => {
const opts = o || {};
return {
title, year,
fav: !!opts.fav,
art: 'linear-gradient(155deg, ' + a + ' 0 62%, ' + b + ' 62% 100%)',
ring: opts.focused ? 'inset 0 0 0 4px #FFB020' : 'none',
umd: opts.focused ? '#2A2414' : '#050606'
};
};
return {
groups: [
group('Tümü', '18420', true),
group('Netflix Filmleri', '1204', false),
group('Yerli Filmler', '2310', false),
group('Aksiyon', '1876', false),
group('Komedi', '1542', false),
group('Dram', '2960', false),
group('Bilim Kurgu', '804', false),
group('Korku', '913', false),
group('Animasyon', '655', false)
],
films: [
film('Oppenheimer', '2023', '#B8552E', '#7E3520'),
film('Kış Uykusu', '2014', '#4C6A8C', '#334A66', { focused: true, fav: true }),
film('Interstellar', '2014', '#3D4A78', '#272F52'),
film('Ahlat Ağacı', '2018', '#7C8A3E', '#566129'),
film('Blade Runner 2049', '2017', '#C2742F', '#8A4E1C', { fav: true }),
film("Bir Zamanlar Anadolu'da", '2011', '#6B5A3A', '#473B25'),
film('Parazit', '2019', '#2F6B4F', '#1E4A38'),
film('Eşkıya', '1996', '#8C3B4A', '#5F2632'),
film('Arrival', '2016', '#5A6E7A', '#3B4A54'),
film('Babam ve Oğlum', '2005', '#A8763A', '#775224', { fav: true }),
film('Vizontele', '2001', '#3F7F8C', '#28565F'),
film('Mad Max: Fury Road', '2015', '#C4622D', '#8A4119'),
film('Sevmek Zamanı', '1965', '#6E6A78', '#4A4753'),
film('Dune: Çöl Gezegeni', '2021', '#9A6A3C', '#6C4826')
]
};
}
}
</script>
</body>
</html>
