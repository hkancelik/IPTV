</sc-for>

<span style="flex: 1; min-width: 0; font-weight: 500; font-stretch: 88%; font-size: 14px; color: #C5CDD1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ch.now}}</span>
<span role="img" aria-label="Canlı" style="width: 8px; height: 8px; border-radius: 50%; background: #FF3B30"></span>
</div>
</article>
</sc-for>
</div>
