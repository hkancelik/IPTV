Favoriler
</a>

<div style="position: absolute; left: 262px; right: 26px; top: 26px; height: 44px; display: flex; align-items: center; gap: 12px">
<h1 style="margin: 0; font-weight: 800; font-size: 28px; letter-spacing: -0.02em">Canlı TV</h1>
<span style="margin-left: 6px; font-weight: 600; font-size: 15px; color: #55607A">Ulusal, 64 kanal</span>
<label style="margin-left: auto; display: flex; align-items: center; gap: 10px; width: 300px; height: 44px; box-sizing: border-box; padding: 0 16px; border-radius: 22px; background: #FFFFFF; color: #55607A; box-shadow: 0 8px 24px rgba(20,30,70,0.07)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
<input type="text" placeholder="Kanal ara" aria-label="Kanal ara" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #0F1728; font: 600 15px 'Manrope', sans-serif">
</label>
<span style="height: 44px; padding: 0 16px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; box-shadow: 0 8px 24px rgba(20,30,70,0.07)">21:47</span>
</div>

<aside aria-label="Kategoriler" style="position: absolute; left: 262px; top: 84px; bottom: 24px; width: 216px; box-sizing: border-box; padding: 14px 12px; border-radius: 28px; background: #FFFFFF; box-shadow: 0 14px 40px rgba(20,30,70,0.09); display: flex; flex-direction: column; gap: 4px">
<label style="display: flex; align-items: center; gap: 8px; height: 40px; margin-bottom: 6px; padding: 0 12px; border-radius: 14px; background: #F2F4F9; color: #55607A">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
<input type="text" placeholder="Kategori ara" aria-label="Kategori ara" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #0F1728; font: 600 14px 'Manrope', sans-serif">
</label>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="10">
<button style="display: flex; align-items: center; justify-content: space-between; height: 42px; padding: 0 12px; border: 0; border-radius: 14px; background: {{g.bg}}; color: {{g.fg}}; font: {{g.weight}} 15px 'Manrope', sans-serif; text-align: left; cursor: pointer">
<span>{{g.name}}</span>
<span style="font-weight: 600; font-size: 13px; color: {{g.countColor}}; font-variant-numeric: tabular-nums">{{g.count}}</span>
</button>
</sc-for>
<button style="margin-top: auto; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border: 0; border-radius: 14px; background: transparent; color: #55607A; font: 700 14px 'Manrope', sans-serif; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"></path></svg>
Kategorileri düzenle
</button>
</aside>

<main style="position: absolute; left: 498px; right: 26px; top: 84px; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{channels}}" as="ch" hint-placeholder-count="8">
<div style="display: flex; align-items: center; gap: 14px; height: 68px; padding: 0 12px 0 10px; border-radius: 20px; background: #FFFFFF; {{ch.rowStyle}}">
<span style="width: 28px; text-align: right; font-weight: 800; font-size: 14px; color: #55607A; font-variant-numeric: tabular-nums">{{ch.no}}</span>
<span style="width: 46px; height: 46px; flex: none; border-radius: 15px; background: {{ch.tint}}; color: {{ch.ink}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px">{{ch.abbr}}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-weight: 800; font-size: 16px">{{ch.name}}</span>
<span style="font-weight: 600; font-size: 13px; color: #55607A">{{ch.now}}</span>
</span>
<span style="width: 150px; display: flex; flex-direction: column; gap: 7px; align-items: flex-end">
<span style="font-weight: 600; font-size: 13px; color: #55607A; font-variant-numeric: tabular-nums">{{ch.time}}</span>
<span style="width: 150px; height: 6px; border-radius: 3px; background: #E3E7F0"><span style="display: block; height: 100%; border-radius: 3px; width: {{ch.pct}}; background: #2F5BFF"></span></span>
</span>
<button aria-label="{{ch.favLabel}}" style="width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent; color: {{ch.heart}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="{{ch.heartFill}}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"></path></svg>
</button>
</div>
</sc-for>
</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
renderVals() {
const group = (name, count, selected) => ({
name, count,
bg: selected ? '#E7ECFF' : 'transparent',
fg: selected ? '#2447D6' : '#0F1728',
weight: selected ? 800 : 600,
countColor: selected ? '#2447D6' : '#55607A'
});
const tints = [['#FFE3E6', '#8A1226'], ['#E7ECFF', '#1E3BB8'], ['#FFF0D6', '#7A4A00'], ['#DDF5E6', '#0F5A2E'], ['#EFE6FF', '#4B1FA8'], ['#DDF3F7', '#0B5566']];
const channel = (no, abbr, name, now, time, pct, fav, focused) => {
const t = tints[(no - 1) % tints.length];
return {
no, abbr, name, now, time, pct,
tint: t[0], ink: t[1],
rowStyle: focused
? 'outline: 3px solid #0F1728; outline-offset: 3px; box-shadow: 0 16px 40px rgba(20,30,70,0.16)'
: 'box-shadow: 0 8px 24px rgba(20,30,70,0.06)',
heart: fav ? '#FF4D5E' : '#8A93A8',
heartFill: fav ? '#FF4D5E' : 'none',
favLabel: fav ? 'Favorilerden çıkar' : 'Favorilere ekle'
};
};
return {
groups: [
group('Tümü', '1.248', false),
group('Ulusal', '64', true),
group('Haber', '38', false),
group('Spor', '52', false),
group('Belgesel', '41', false),
group('Çocuk', '29', false),
group('Sinema', '77', false),
group('Müzik', '33', false),
group('Yerel', '58', false),
group('Avrupa', '112', false)
],
channels: [
channel(1, 'T1', 'TRT 1', 'Akşam dizisi', '20:00 – 22:30', '71%', true, false),
channel(2, 'KD', 'Kanal D', 'Akşam dizisi', '20:00 – 23:00', '59%', false, false),
channel(3, 'AT', 'ATV', 'Yerli sinema', '21:15 – 23:20', '26%', false, true),
channel(4, 'SH', 'Show TV', 'Akşam dizisi', '20:00 – 23:15', '55%', false, false),
channel(5, 'ST', 'Star TV', 'Yarışma', '20:30 – 22:45', '57%', false, false),
channel(6, 'NW', 'NOW', 'Akşam dizisi', '20:00 – 22:50', '63%', false, false),
channel(7, 'T8', 'TV8', 'Yarışma', '20:00 – 00:15', '42%', true, false),
channel(8, 'T2', 'TRT 2', 'Belgesel kuşağı', '21:30 – 22:20', '34%', false, false)
]
};
}
}
</script>
</body>
</html>
