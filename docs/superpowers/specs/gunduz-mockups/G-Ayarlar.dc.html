<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Gündüz, ayarlar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#55607A;text-decoration:none}a:hover{color:#0F1728}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; box-sizing: border-box; overflow: hidden; background: #E9EDF4; color: #0F1728; font-family: 'Manrope', sans-serif">

<nav aria-label="Ana menü" style="position: absolute; left: 24px; top: 24px; bottom: 24px; width: 212px; box-sizing: border-box; padding: 22px 14px 16px; border-radius: 28px; background: #FFFFFF; box-shadow: 0 14px 40px rgba(20,30,70,0.09); display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 10px 16px">
<span style="width: 36px; height: 36px; border-radius: 12px; background: #2F5BFF; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>
</span>
<span style="font-weight: 800; font-size: 20px">IPTV</span>
</div>
<sc-for list="{{nav}}" as="n" hint-placeholder-count="6">
<a href="{{n.href}}" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; border-radius: 16px; background: {{n.bg}}; color: {{n.fg}}; font-weight: {{n.weight}}; font-size: 15px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
{{n.label}}
</a>
</sc-for>
<a href="G-Profiller.dc.html" style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 18px; background: #F2F4F9; color: #0F1728">
<span style="width: 36px; height: 36px; border-radius: 50%; background: #0F1728; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px">H</span>
<span style="font-weight: 700; font-size: 15px">Hakan</span>
</a>
</nav>

<div style="position: absolute; left: 262px; right: 26px; top: 26px; height: 44px; display: flex; align-items: center">
<h1 style="margin: 0; font-weight: 800; font-size: 28px; letter-spacing: -0.02em">Ayarlar</h1>
<span style="margin-left: auto; height: 44px; padding: 0 16px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; box-shadow: 0 8px 24px rgba(20,30,70,0.07)">21:47</span>
</div>

<aside aria-label="Ayar bölümleri" style="position: absolute; left: 262px; top: 84px; width: 216px; box-sizing: border-box; padding: 12px; border-radius: 28px; background: #FFFFFF; box-shadow: 0 14px 40px rgba(20,30,70,0.09); display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{sections}}" as="s" hint-placeholder-count="6">
<button style="height: 44px; padding: 0 14px; border: 0; border-radius: 14px; background: {{s.bg}}; color: {{s.fg}}; font: {{s.weight}} 15px 'Manrope', sans-serif; text-align: left; cursor: pointer">{{s.name}}</button>
</sc-for>
</aside>

<main style="position: absolute; left: 498px; right: 26px; top: 84px; display: flex; flex-direction: column; gap: 16px">

<section aria-label="Hesap" style="display: flex; align-items: center; gap: 16px; height: 84px; box-sizing: border-box; padding: 0 18px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 10px 30px rgba(20,30,70,0.07)">
<span style="width: 48px; height: 48px; border-radius: 50%; background: #E7ECFF; color: #1E3BB8; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px">H</span>
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 800; font-size: 17px">Hakan</span>
<span style="font-weight: 600; font-size: 13px; color: #55607A">[SUNUCU ADRESİ]</span>
</span>
<span style="margin-left: 14px; display: flex; flex-direction: column; gap: 2px; padding-left: 16px; border-left: 1px solid #E3E7F0">
<span style="font-weight: 600; font-size: 13px; color: #55607A">Abonelik bitişi</span>
<span style="font-weight: 800; font-size: 15px">[TARİH]</span>
</span>
<span style="display: flex; flex-direction: column; gap: 2px; padding-left: 16px; border-left: 1px solid #E3E7F0">
<span style="font-weight: 600; font-size: 13px; color: #55607A">Eşzamanlı bağlantılar</span>
<span style="font-weight: 800; font-size: 15px; color: #0F5A2E">1 / 2 kullanımda</span>
</span>
<a href="G-Profiller.dc.html" style="margin-left: auto; height: 44px; padding: 0 16px; border-radius: 22px; background: #F2F4F9; color: #0F1728; display: flex; align-items: center; font-weight: 700; font-size: 14px">Kullanıcı değiştir</a>
</section>

<section aria-label="Oynatıcı" style="box-sizing: border-box; padding: 8px 10px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 10px 30px rgba(20,30,70,0.07); display: flex; flex-direction: column">
<h2 style="margin: 10px 10px 4px; font-weight: 800; font-size: 18px">Oynatıcı</h2>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<div style="box-sizing: border-box; display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 8px 12px; border-radius: 18px; {{r.style}}">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 800; font-size: 15px">{{r.title}}</span>
<span style="font-weight: 600; font-size: 13px; color: #55607A">{{r.desc}}</span>
</div>
<sc-if value="{{r.isChoice}}" hint-placeholder-val="{{ true }}">
<div role="radiogroup" aria-label="{{r.title}}" style="display: flex; gap: 2px; padding: 4px; border-radius: 18px; background: #F2F4F9">
<sc-for list="{{r.options}}" as="o" hint-placeholder-count="3">
<button role="radio" aria-checked="{{o.checked}}" style="height: 34px; padding: 0 14px; border: 0; border-radius: 14px; background: {{o.bg}}; color: {{o.fg}}; font: {{o.weight}} 13px 'Manrope', sans-serif; box-shadow: {{o.shadow}}; cursor: pointer">{{o.label}}</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{r.isSwitch}}" hint-placeholder-val="{{ false }}">
<button role="switch" aria-checked="{{r.on}}" aria-label="{{r.title}}" style="position: relative; width: 52px; height: 30px; padding: 0; border: 0; border-radius: 15px; background: {{r.track}}; cursor: pointer">
<span style="position: absolute; top: 4px; left: {{r.knobLeft}}; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 6px rgba(20,30,70,0.25)"></span>
</button>
</sc-if>
</div>
</sc-for>
</section>

</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
renderVals() {
const icons = {
home: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
live: 'M5 7h14a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3zM17 2l-5 5-5-5',
films: 'M6 3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3zM7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4M3 12h18',
series: 'M7 2h10M5 6h14M6 10h12a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-6a3 3 0 0 1 3-3z',
fav: 'M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z',
settings: 'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M2 14h4M10 8h4M18 16h4'
};
const nav = (label, icon, href, active) => ({
label, href, icon: icons[icon],
bg: active ? '#2F5BFF' : 'transparent',
fg: active ? '#FFFFFF' : '#55607A',
weight: active ? 800 : 600
});
const section = (name, selected) => ({
name,
bg: selected ? '#E7ECFF' : 'transparent',
fg: selected ? '#2447D6' : '#0F1728',
weight: selected ? 800 : 600
});
const rest = 'background: transparent';
const focus = 'background: #F2F4F9; outline: 3px solid #0F1728; outline-offset: -3px';
const choice = (title, desc, labels, picked) => ({
title, desc, isChoice: true, isSwitch: false, style: rest,
options: labels.map((label, i) => ({
label,
checked: i === picked ? 'true' : 'false',
bg: i === picked ? '#FFFFFF' : 'transparent',
fg: i === picked ? '#0F1728' : '#55607A',
weight: i === picked ? 800 : 700,
shadow: i === picked ? '0 2px 8px rgba(20,30,70,0.12)' : 'none'
}))
});
const toggle = (title, desc, on, focused) => ({
title, desc, isChoice: false, isSwitch: true,
style: focused ? focus : rest,
on: on ? 'true' : 'false',
track: on ? '#2F5BFF' : '#C5CCDB',
knobLeft: on ? '26px' : '4px'
});
return {
nav: [
nav('Ana sayfa', 'home', 'Main.dc.html', false),
nav('Canlı TV', 'live', 'G-Canli.dc.html', false),
nav('Filmler', 'films', 'G-Filmler.dc.html', false),
nav('Diziler', 'series', 'G-Detay.dc.html', false),
nav('Favoriler', 'fav', 'Main.dc.html', false),
nav('Ayarlar', 'settings', 'G-Ayarlar.dc.html', true)
],
sections: [
section('Hesap', false),
section('Oynatıcı', true),
section('İçerik', false),
section('Telefonu kumanda yap', false),
section('Görünüm', false),
section('Kısayollar', false)
],
rows: [
choice('Tercih edilen ses dili', 'Birden çok ses parçası olan içerikte ilk seçilecek dil', ['Dosya varsayılanı', 'Türkçe', 'İngilizce'], 0),
choice('Tercih edilen altyazı', 'Açılışta gösterilecek altyazı', ['Kapalı', 'Türkçe', 'İngilizce'], 0),
choice('İleri/geri sarma süresi', 'Sarma tuşlarının atladığı süre', ['5 sn', '10 sn', '30 sn'], 1),
toggle('Donanım hızlandırma', 'Video takılıyor ya da bozuk görünüyorsa kapatmayı dene', true, true),
toggle('Kaldığım yerden devam et', 'Film ve dizilerde son konumu hatırla', true, false),
toggle('Sonraki bölümü otomatik oynat', 'Bölüm bitince 10 saniye sayar, sonra sıradaki bölüme geçer', true, false)
]
};
}
}
</script>
</body>
</html>
