<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Gündüz, profil seçimi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F1728;text-decoration:none}a:hover{color:#0F1728}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; box-sizing: border-box; overflow: hidden; background: #E9EDF4; color: #0F1728; font-family: 'Manrope', sans-serif">

<div style="position: absolute; left: 40px; right: 40px; top: 32px; height: 44px; display: flex; align-items: center; gap: 10px">
<span style="width: 36px; height: 36px; border-radius: 12px; background: #2F5BFF; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>
</span>
<span style="font-weight: 800; font-size: 20px">IPTV</span>
<span style="margin-left: auto; height: 44px; padding: 0 16px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; box-shadow: 0 8px 24px rgba(20,30,70,0.07)">21:47</span>
</div>

<main style="position: absolute; left: 0; right: 0; top: 150px; display: flex; flex-direction: column; align-items: center">
<h1 style="margin: 0; font-weight: 800; font-size: 40px; letter-spacing: -0.02em">Kullanıcı seç</h1>
<p style="margin: 10px 0 0; font-weight: 600; font-size: 16px; color: #55607A">Açılışta son kullanılan hesapla otomatik giriş yapılır.</p>

<div style="margin-top: 44px; display: flex; gap: 22px">
<sc-for list="{{profiles}}" as="p" hint-placeholder-count="3">
<a href="Main.dc.html" style="width: 210px; box-sizing: border-box; padding: 26px 16px 22px; border-radius: 28px; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 14px; {{p.ring}}">
<span style="width: 96px; height: 96px; border-radius: 50%; background: {{p.tint}}; color: {{p.ink}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 40px">{{p.initial}}</span>
<span style="display: flex; flex-direction: column; align-items: center; gap: 3px">
<span style="font-weight: 800; font-size: 18px">{{p.name}}</span>
<span style="font-weight: 600; font-size: 13px; color: #55607A">{{p.host}}</span>
</span>
<span style="height: 26px; padding: 0 10px; border-radius: 13px; background: {{p.chipBg}}; color: #2447D6; display: flex; align-items: center; font-weight: 800; font-size: 12px; opacity: {{p.chipShow}}">Son kullanılan</span>
</a>
</sc-for>
<button style="width: 210px; box-sizing: border-box; padding: 26px 16px 22px; border: 2px dashed #C5CCDB; border-radius: 28px; background: transparent; color: #0F1728; display: flex; flex-direction: column; align-items: center; gap: 14px; font-family: 'Manrope', sans-serif; cursor: pointer">
<span style="width: 96px; height: 96px; border-radius: 50%; background: #FFFFFF; color: #2F5BFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(20,30,70,0.07)">
<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</span>
<span style="display: flex; flex-direction: column; align-items: center; gap: 3px">
<span style="font-weight: 800; font-size: 18px">Kullanıcı ekle</span>
<span style="font-weight: 600; font-size: 13px; color: #55607A">Telefondan QR ya da elle</span>
</span>
<span style="height: 26px"></span>
</button>
</div>

<button style="margin-top: 36px; display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 20px 0 16px; border: 0; border-radius: 23px; background: #FFFFFF; color: #0F1728; font: 700 15px 'Manrope', sans-serif; box-shadow: 0 8px 24px rgba(20,30,70,0.07); cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
Kullanıcıları düzenle
</button>
</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
renderVals() {
const profile = (name, tint, ink, o) => {
const opts = o || {};
return {
name, tint, ink,
initial: name.charAt(0),
host: '[SUNUCU ADRESİ]',
chipShow: opts.last ? 1 : 0,
chipBg: '#E7ECFF',
ring: opts.focused ? 'outline: 3px solid #0F1728; outline-offset: 4px; box-shadow: 0 20px 44px rgba(20,30,70,0.16)' : 'box-shadow: 0 14px 40px rgba(20,30,70,0.09)'
};
};
return {
profiles: [
profile('Hakan', '#E7ECFF', '#1E3BB8', { last: true, focused: true }),
profile('Salon', '#FFF0D6', '#7A4A00'),
profile('Misafir', '#DDF5E6', '#0F5A2E')
]
};
}
}
</script>
</body>
</html>
