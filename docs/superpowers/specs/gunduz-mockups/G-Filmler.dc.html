<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Gündüz, Filmler</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#55607A;text-decoration:none}a:hover{color:#0F1728}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; box-sizing: border-box; overflow: hidden; background: #E9EDF4; color: #0F1728; font-family: 'Manrope', sans-serif">

<nav aria-label="Ana menü" style="position: absolute; left: 24px; top: 24px; bottom: 24px; width: 212px; box-sizing: border-box; padding: 22px 14px 16px; border-radius: 28px; background: #FFFFFF; box-shadow: 0 14px 40px rgba(20,30,70,0.09); display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 10px 16px">
<span style="width: 36px; height: 36px; border-radius: 12px; background: #2F5BFF; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>
</span>
<span style="font-weight: 800; font-size: 20px">IPTV</span>
</div>
<sc-for list="{{nav}}" as="n" hint-placeholder-count="6">
<a href="{{n.href}}" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; border-radius: 16px; background: {{n.bg}}; color: {{n.fg}}; font-weight: {{n.weight}}; font-size: 15px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
{{n.label}}
</a>
</sc-for>
<a href="G-Profiller.dc.html" style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 18px; background: #F2F4F9; color: #0F1728">
<span style="width: 36px; height: 36px; border-radius: 50%; background: #0F1728; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px">H</span>
<span style="font-weight: 700; font-size: 15px">Hakan</span>
</a>
</nav>

<div style="position: absolute; left: 262px; right: 26px; top: 26px; height: 44px; display: flex; align-items: center; gap: 12px">
<h1 style="margin: 0; font-weight: 800; font-size: 28px; letter-spacing: -0.02em">Filmler</h1>
<span style="margin-left: 6px; font-weight: 600; font-size: 15px; color: #55607A">18.420 film</span>
<label style="margin-left: auto; display: flex; align-items: center; gap: 10px; width: 260px; height: 44px; box-sizing: border-box; padding: 0 16px; border-radius: 22px; background: #FFFFFF; color: #55607A; box-shadow: 0 8px 24px rgba(20,30,70,0.07)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
<input type="text" placeholder="Film ara" aria-label="Film ara" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #0F1728; font: 600 15px 'Manrope', sans-serif">
</label>
<button style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border: 0; border-radius: 22px; background: #FFFFFF; color: #0F1728; font: 700 15px 'Manrope', sans-serif; box-shadow: 0 8px 24px rgba(20,30,70,0.07); cursor: pointer">
<span style="font-weight: 600; color: #55607A">Sırala:</span>
Yeni eklenen
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#55607A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
</button>
<span style="height: 44px; padding: 0 16px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; box-shadow: 0 8px 24px rgba(20,30,70,0.07)">21:47</span>
</div>

<aside aria-label="Kategoriler" style="position: absolute; left: 262px; top: 84px; bottom: 24px; width: 216px; box-sizing: border-box; padding: 14px 12px; border-radius: 28px; background: #FFFFFF; box-shadow: 0 14px 40px rgba(20,30,70,0.09); display: flex; flex-direction: column; gap: 4px">
<label style="display: flex; align-items: center; gap: 8px; height: 40px; margin-bottom: 6px; padding: 0 12px; border-radius: 14px; background: #F2F4F9; color: #55607A">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
<input type="text" placeholder="Kategori ara" aria-label="Kategori ara" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #0F1728; font: 600 14px 'Manrope', sans-serif">
</label>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="10">
<button style="display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 42px; padding: 0 12px; border: 0; border-radius: 14px; background: {{g.bg}}; color: {{g.fg}}; font: {{g.weight}} 15px 'Manrope', sans-serif; text-align: left; cursor: pointer">
<span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.name}}</span>
<span style="font-weight: 600; font-size: 13px; color: {{g.countColor}}; font-variant-numeric: tabular-nums">{{g.count}}</span>
</button>
</sc-for>
<button style="margin-top: auto; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border: 0; border-radius: 14px; background: transparent; color: #55607A; font: 700 14px 'Manrope', sans-serif; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"></path></svg>
Kategorileri düzenle
</button>
</aside>

<main style="position: absolute; left: 498px; right: 26px; top: 84px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 20px 16px">
<sc-for list="{{films}}" as="f" hint-placeholder-count="12">
<a href="G-Detay.dc.html" style="display: flex; flex-direction: column; gap: 10px; color: #0F1728">
<div style="position: relative; height: 172px; border-radius: 20px; background: {{f.art}}; {{f.ring}}">
<span role="img" aria-label="{{f.favLabel}}" style="position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%; background: #FFFFFF; color: {{f.heart}}; display: flex; align-items: center; justify-content: center; opacity: {{f.heartShow}}; box-shadow: 0 4px 12px rgba(20,30,70,0.18)">
<svg width="15" height="15" viewBox="0 0 24 24" fill="{{f.heartFill}}" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"></path></svg>
</span>
</div>
<div style="display: flex; flex-direction: column; padding: 0 4px">
<span style="font-weight: 800; font-size: 15px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.title}}</span>
<span style="font-weight: 600; font-size: 13px; color: #55607A">{{f.meta}}</span>
</div>
</a>
</sc-for>
</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
renderVals() {
const icons = {
home: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
live: 'M5 7h14a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3zM17 2l-5 5-5-5',
films: 'M6 3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3zM7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4M3 12h18',
series: 'M7 2h10M5 6h14M6 10h12a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-6a3 3 0 0 1 3-3z',
fav: 'M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z',
settings: 'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M2 14h4M10 8h4M18 16h4'
};
const nav = (label, icon, href, active) => ({
label, href, icon: icons[icon],
bg: active ? '#2F5BFF' : 'transparent',
fg: active ? '#FFFFFF' : '#55607A',
weight: active ? 800 : 600
});
const group = (name, count, selected) => ({
name, count,
bg: selected ? '#E7ECFF' : 'transparent',
fg: selected ? '#2447D6' : '#0F1728',
weight: selected ? 800 : 600,
countColor: selected ? '#2447D6' : '#55607A'
});
const art = {
desert: 'radial-gradient(ellipse 140% 40% at 50% 110%, #3B2A12 0 60%, rgba(59,42,18,0) 61%), linear-gradient(180deg, #0F3D2E 0%, #3E8E5A 55%, #E9D27A 100%)',
fire: 'radial-gradient(circle at 50% 44%, #FFF1C2 0 12%, #FFB347 24%, rgba(255,90,30,0.6) 42%, rgba(255,90,30,0) 66%), linear-gradient(180deg, #120807, #3A0F0A)',
winter: 'radial-gradient(ellipse 130% 34% at 30% 106%, #E8EEF5 0 60%, rgba(232,238,245,0) 61%), linear-gradient(180deg, #26364F 0%, #7F97B5 70%, #DCE6F2 100%)',
party: 'radial-gradient(circle at 34% 28%, #FFD166 0 16%, rgba(255,209,102,0) 16.5%), linear-gradient(160deg, #6C3BD9 0%, #C04BD9 60%, #FF7AB8 100%)',
space: 'radial-gradient(circle at 50% 38%, #000000 0 18%, rgba(0,0,0,0) 18.5%), radial-gradient(circle at 50% 38%, rgba(255,214,150,0.95) 0 22%, rgba(255,170,80,0.4) 32%, rgba(255,170,80,0) 54%), linear-gradient(180deg, #05070F, #0B1530)',
city: 'repeating-linear-gradient(90deg, rgba(10,8,25,0.92) 0 12px, rgba(10,8,25,0) 12px 20px), linear-gradient(180deg, #1A0B2E 0%, #FF5E3A 62%, #FFC371 100%)',
sea: 'radial-gradient(ellipse 26% 40% at 50% 40%, #0B0F14 0 60%, rgba(11,15,20,0) 61%), linear-gradient(180deg, #9FB7C4 0%, #5E7F8E 60%, #2F4650 100%)',
field: 'radial-gradient(circle at 70% 22%, #FFF4D6 0 10%, rgba(255,244,214,0) 10.5%), linear-gradient(180deg, #6FA8C9 0%, #C9DDB0 52%, #8A9A3E 53%, #566129 100%)',
red: 'radial-gradient(ellipse 60% 60% at 50% 112%, #1A0508 0 60%, rgba(26,5,8,0) 61%), linear-gradient(180deg, #5F1622 0%, #B3303F 60%, #E0606A 100%)',
steppe: 'radial-gradient(circle at 30% 26%, #FFF0C9 0 9%, rgba(255,240,201,0) 9.5%), linear-gradient(180deg, #D9A45A 0%, #B8763A 50%, #6B4A26 51%, #4A3218 100%)',
night: 'radial-gradient(circle at 72% 24%, #F4F1E4 0 8%, rgba(244,241,228,0) 8.5%), radial-gradient(ellipse 120% 40% at 50% 112%, #0B1020 0 60%, rgba(11,16,32,0) 61%), linear-gradient(180deg, #121A36 0%, #2C3E74 100%)',
road: 'linear-gradient(180deg, #F2B880 0%, #E07A3A 48%, #4A2A1E 49%, #2A1812 100%)'
};
const film = (title, year, lang, a, o) => {
const opts = o || {};
return {
title, meta: year + ', ' + lang, art: art[a],
ring: opts.focused ? 'outline: 3px solid #0F1728; outline-offset: 4px; box-shadow: 0 18px 40px rgba(20,30,70,0.28)' : 'box-shadow: 0 10px 24px rgba(20,30,70,0.12)',
heartShow: opts.fav || opts.focused ? 1 : 0,
heart: opts.fav ? '#FF4D5E' : '#55607A',
heartFill: opts.fav ? '#FF4D5E' : 'none',
favLabel: opts.fav ? 'Favorilerde' : 'Favorilere ekle'
};
};
return {
nav: [
nav('Ana sayfa', 'home', 'Main.dc.html', false),
nav('Canlı TV', 'live', 'G-Canli.dc.html', false),
nav('Filmler', 'films', 'G-Filmler.dc.html', true),
nav('Diziler', 'series', 'G-Detay.dc.html', false),
nav('Favoriler', 'fav', 'Main.dc.html', false),
nav('Ayarlar', 'settings', 'G-Ayarlar.dc.html', false)
],
groups: [
group('Tümü', '18.420', true),
group('Netflix Filmleri', '1.204', false),
group('Yerli Filmler', '2.310', false),
group('Aksiyon', '1.876', false),
group('Komedi', '1.542', false),
group('Dram', '2.960', false),
group('Bilim Kurgu', '804', false),
group('Korku', '913', false),
group('Animasyon', '655', false),
group('Belgesel', '478', false)
],
films: [
film('Oppenheimer', '2023', 'TR', 'fire'),
film('Kış Uykusu', '2014', 'TR', 'winter', { focused: true, fav: true }),
film('Interstellar', '2014', 'TR', 'space'),
film('Ahlat Ağacı', '2018', 'TR', 'field'),
film('Blade Runner 2049', '2017', 'EN', 'city', { fav: true }),
film("Bir Zamanlar Anadolu'da", '2011', 'TR', 'steppe'),
film('Parazit', '2019', 'TR', 'party'),
film('Eşkıya', '1996', 'TR', 'red'),
film('Arrival', '2016', 'EN', 'sea'),
film('Babam ve Oğlum', '2005', 'TR', 'road', { fav: true }),
film('Dune: Çöl Gezegeni', '2021', 'TR', 'desert'),
film('Masumiyet', '1997', 'TR', 'night')
]
};
}
}
</script>
</body>
</html>
