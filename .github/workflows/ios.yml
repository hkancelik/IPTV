name: iOS build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26+ (iOS 26 SDK for Liquid Glass)
        run: |
          XCODE_APP=$(python3 -c '
          import glob, os, re
          apps = sorted(set(os.path.realpath(p) for p in glob.glob("/Applications/Xcode_2[6-9]*.app")), key=lambda p: [int(x) for x in re.findall(r"\d+", os.path.basename(p))])
          print(apps[-1] if apps else "")
          ')
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode 26+ installation found on runner" >&2
            ls -la /Applications
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r iptv-ios.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-ios
          path: iptv-ios.ipa
