name: Windows build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip the app
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          if (-not (Test-Path $releaseDir)) {
            throw "Release directory not found: $releaseDir"
          }
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue staging, iptv-windows.zip
          New-Item -ItemType Directory -Force -Path staging/IPTV | Out-Null
          Copy-Item -Recurse -Force "$releaseDir/*" staging/IPTV/
          Compress-Archive -Path staging/IPTV -DestinationPath iptv-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-windows
          path: iptv-windows.zip
